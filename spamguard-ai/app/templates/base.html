<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SpamGuard AI — local SMS spam analysis using machine learning.">
  <title>{% block title %}SpamGuard AI{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v='2') }}">
  {% block head %}{% endblock %}
</head>
<body data-page="{{ active_page }}">
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <header class="app-header">
    <div class="container">
      <a class="brand" href="{{ url_for('main.analyzer') }}">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2.5 4.5 5.6v5.3c0 4.8 3.1 8.7 7.5 10.6 4.4-1.9 7.5-5.8 7.5-10.6V5.6L12 2.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="m8.6 11.8 2.2 2.2 4.6-4.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">SpamGuard<span>AI</span></span>
          <span class="brand-tag">Local SMS spam analysis</span>
        </span>
      </a>
      <nav class="nav-links" aria-label="Main navigation">
        <a class="nav-link {% if active_page == 'analyzer' %}active{% endif %}" href="{{ url_for('main.analyzer') }}">Analyzer</a>
        <a class="nav-link {% if active_page == 'model' %}active{% endif %}" href="{{ url_for('main.model_info_page') }}">Model Info</a>
        <a class="nav-link {% if active_page == 'analytics' %}active{% endif %}" href="{{ url_for('main.analytics_page') }}">Analytics</a>
      </nav>
      <span class="header-chip"><i class="bi bi-hdd-network"></i> Runs locally</span>
    </div>
  </header>

  <main class="app-main">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="app-footer">
    <div class="container">
      <p class="mb-0">Academic decision-support demo. A prediction is a statistical signal, not a definitive fraud determination.</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
